<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CelyaVox - Chargement</title>
    <link rel="stylesheet" type="text/css" href="https://dtd6jl0d42sve.cloudfront.net/lib/fonts/font_awesome/css/font-awesome.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #loader {
            text-align: center;
            opacity: 1;
            transition: opacity 0.3s ease-out;
        }

        #loader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spinner {
            font-size: 60px;
            color: white;
            margin-bottom: 20px;
            animation: spin 2s linear infinite;
        }

        .loader-text {
            color: white;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .loader-subtext {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error Container */
        #error-container {
            opacity: 0;
            transition: opacity 0.3s ease-out;
            pointer-events: none;
        }

        #error-container.show {
            opacity: 1;
            pointer-events: all;
        }

        .error-box {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            text-align: center;
            position: absolute;
        }

        .error-icon {
            font-size: 60px;
            color: #dc3545;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .error-detail {
            font-size: 14px;
            color: #999;
            margin-bottom: 30px;
            font-style: italic;
        }

        .retry-button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .retry-button:hover {
            background-color: #764ba2;
        }

        .retry-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <!-- Loading Animation -->
    <div id="loader">
        <div class="loader-spinner fa fa-hourglass-half"></div>
        <div class="loader-text">Chargement de l'application...</div>
        <div class="loader-subtext">Veuillez patienter</div>
    </div>

    <!-- Error Container -->
    <div id="error-container">
        <div class="error-box">
            <div class="error-icon fa fa-exclamation-triangle"></div>
            <div class="error-title">Erreur de connexion</div>
            <div class="error-message">Impossible de charger l'application.</div>
            <div class="error-detail">Veuillez vérifier votre connexion Internet et réessayer.</div>
            <button class="retry-button" onclick="retryConnection()">Réessayer</button>
        </div>
    </div>

    <script>
        // Configuration depuis le preload (injectée par Electron)
        let serverUrl = null;  // Pas de valeur par défaut
        let timeout = 30000;
        let configReceived = false;

        function showError() {
            const loader = document.getElementById('loader');
            const errorContainer = document.getElementById('error-container');
            
            loader.classList.add('fade-out');
            setTimeout(() => {
                errorContainer.classList.add('show');
            }, 300);
        }

        function retryConnection() {
            const errorContainer = document.getElementById('error-container');
            const loader = document.getElementById('loader');
            
            errorContainer.classList.remove('show');
            loader.classList.remove('fade-out');
            
            loadRemoteApp();
        }

        // Fonction pour lancer l'authentification SAML
        async function initSamlAuth() {
            console.log('🔐 Lancement de l\'authentification SAML...');
            
            try {
                if (!window.electron || !window.electron.initSamlAuth) {
                    throw new Error('API SAML non disponible');
                }
                
                // Mettre à jour le message de chargement
                document.querySelector('.loader-text').textContent = 'Authentification SAML...';
                
                // Appeler le handler SAML dans main.js
                const result = await window.electron.initSamlAuth();
                
                if (!result.success) {
                    throw new Error(result.error || 'Erreur inconnue lors de l\'initialisation SAML');
                }
                
                console.log('✅ Authentification SAML initialisée');
                
                // Écouter les événements d'authentification
                if (window.electron && window.electron.on) {
                    // Succès SAML - écouter le bon canal avec le nouvel objet result
                    window.electron.on('auth:saml-success', (result) => {
                        console.log('✅ Authentification SAML réussie!');
                        console.log('👤 Utilisateur:', result.user?.name);
                        
                        // Sauvegarder les informations utilisateur
                        if (result.user) {
                            localStorage.setItem('SamlUser', JSON.stringify(result.user));
                            console.log('✅ Utilisateur sauvegardé dans localStorage');
                        }
                        
                    // Sauvegarder la configuration complète depuis l'API (41 paramètres)
                        if (result.config && typeof result.config === 'object') {
                            const configKeys = Object.keys(result.config);
                            console.log(`📝 Sauvegarde de ${configKeys.length} paramètres de config...`);
                            
                            // IMPORTANT: Sauvegarder AUSSI dans localStorage AND cookies
                            // localStorage pour l'app distante (si possible)
                            // Cookies pour garantir la persistance à travers les origines
                            
                            let successCount = 0;
                            for (const [key, value] of Object.entries(result.config)) {
                                const stringValue = typeof value === 'string' ? value : JSON.stringify(value);
                                
                                // Sauvegarder dans localStorage
                                localStorage.setItem(key, stringValue);
                                
                                // Sauvegarder dans les cookies (important pour partager entre origines)
                                // Valider la taille pour les cookies (max ~4KB par cookie)
                                if (stringValue.length < 3500) {
                                    document.cookie = `${encodeURIComponent(key)}=${encodeURIComponent(stringValue)}; path=/; SameSite=Lax; secure=false`;
                                    console.log(`  🍪 Cookie défini: ${key}`);
                                } else {
                                    console.warn(`  ⚠️ Valeur trop grande pour cookie: ${key} (${stringValue.length} bytes)`);
                                }
                                
                                successCount++;
                                
                                // Log pour les clés importantes
                                if (key === 'profileName' || key === 'SipDomain' || key === 'SipUsername' || key === 'SipPassword') {
                                    console.log(`  ✅ ${key} = ${stringValue.substring(0, 50)}`);
                                }
                            }
                            console.log(`✅ ${successCount} paramètres sauvegardés (localStorage + cookies)`);
                            
                            // Vérification : afficher quelques valeurs pour confirmation
                            const storedSipDomain = localStorage.getItem('SipDomain');
                            const storedProfileName = localStorage.getItem('profileName');
                            console.log('🔍 Vérification localStorage:');
                            console.log('  - profileName:', storedProfileName?.substring(0, 30));
                            console.log('  - SipDomain:', storedSipDomain);
                            
                            // Afficher les cookies pour debug
                            console.log('🍪 Cookies définis:', document.cookie);
                        }
                        
                        // Après authentification réussie, charger l'application
                        document.querySelector('.loader-text').textContent = 'Chargement de l\'application...';
                        setTimeout(() => loadRemoteApp(), 2000);
                    });
                    
                    // Erreur SAML
                    window.electron.on('auth:saml-error', (result) => {
                        console.error('❌ Erreur SAML:', result.error);
                        alert(`Erreur d'authentification SAML: ${result.error}`);
                        showError();
                    });
                }
                
            } catch (err) {
                console.error('❌ Erreur lors de l\'initialisation SAML:', err);
                alert(`Erreur SAML: ${err.message}`);
                showError();
            }
        }

        function loadRemoteApp() {
            if (!serverUrl) {
                console.error('❌ Pas de serverUrl disponible. Config reçue?', configReceived);
                showError();
                return;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);

            fetch(serverUrl, {
                signal: controller.signal,
                method: 'GET',
                mode: 'no-cors'
            })
                .then(response => {
                    clearTimeout(timeoutId);
                    console.log('✅ Serveur accessible, chargement de l\'application...');
                    
                    // Construire l'URL finale avec la configuration en paramètres
                    let finalUrl = serverUrl;
                    
                    // Récupérer TOUTES les données depuis localStorage (sauvegardées par SAML)
                    const configData = {};
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        const value = localStorage.getItem(key);
                        configData[key] = value;
                        console.log(`📝 Config à passer: ${key} = ${value.substring(0, 50)}`);
                    }
                    
                    // Si la config existe, l'ajouter à l'URL en hash (pas de limite de taille)
                    if (Object.keys(configData).length > 0) {
                        const configString = JSON.stringify(configData);
                        const configBase64 = btoa(configString);
                        // Utiliser le hash au lieu de GET pour éviter les limites de taille d'URL
                        finalUrl += '#celyavox_config=' + encodeURIComponent(configBase64);
                        console.log('✅ Configuration SAML encodée en base64 (hash)');
                        console.log('[DEBUG] Taille config:', configBase64.length, 'bytes');
                        console.log('[DEBUG] Nombre de paramètres:', Object.keys(configData).length);
                    }
                    
                    // Rediriger vers l'URL distante
                    console.log('🌐 Redirection vers:', finalUrl.substring(0, 100) + '...');
                    window.location.href = finalUrl;
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    if (err.name === 'AbortError') {
                        console.error('⏱️ Timeout après', timeout / 1000, 'secondes');
                    } else {
                        console.error('❌ Erreur de connexion:', err.message);
                    }
                    showError();
                });
        }

        // Vérifier si SAML doit être utilisé avant de charger l'app distante
        async function checkAndInitSSO() {
            try {
                // ============================================================
                // NOUVEAU: Vérifier d'abord s'il existe des données SAML persistées
                // ============================================================
                if (window.electron && window.electron.getAuthSession) {
                    console.log('🔐 [NOUVEAU] Vérification des données SAML persistées...');
                    try {
                        const sessionResult = await window.electron.getAuthSession();
                        
                        if (sessionResult.exists && sessionResult.user && sessionResult.config) {
                            console.log('✅ Données SAML trouvées! Restauration dans localStorage...');
                            
                            // Restaurer user
                            localStorage.setItem('SamlUser', JSON.stringify(sessionResult.user));
                            
                            // Restaurer config
                            for (const [key, value] of Object.entries(sessionResult.config)) {
                                localStorage.setItem(key, typeof value === 'string' ? value : JSON.stringify(value));
                            }
                            
                            console.log('✅ Données restaurées - Chargement direct de l\'application');
                            console.log('   User:', sessionResult.user?.name);
                            console.log('   Config keys:', Object.keys(sessionResult.config).length);
                            
                            // Charger directement l'application sans refaire SAML
                            loadRemoteApp();
                            return;
                        } else {
                            console.log('ℹ️ Pas de données SAML persistées');
                        }
                    } catch (err) {
                        console.warn('⚠️ Erreur lors de la vérification des données persistées:', err.message);
                    }
                }
                
                // ============================================================
                // Si pas de données persistées, vérifier sso.ini
                // ============================================================
                // Vérifier si sso.ini existe
                if (window.electron && window.electron.checkSsoFile) {
                    console.log('🔍 Vérification du fichier sso.ini...');
                    const result = await window.electron.checkSsoFile();
                    
                    console.log('📋 Résultat vérification sso.ini:', result);
                    
                    if (result.exists) {
                        // Le fichier sso.ini existe - lancer l'authentification SAML
                        console.log('✅ Fichier sso.ini trouvé - Lancement SAML');
                        await initSamlAuth();
                        return; // Ne pas charger l'app distante ici
                    } else {
                        console.log('ℹ️ Fichier sso.ini non trouvé - Chargement direct de l\'application');
                        loadRemoteApp();
                    }
                } else {
                    console.warn('⚠️ API checkSsoFile non disponible - Chargement direct');
                    loadRemoteApp();
                }
            } catch (err) {
                console.error('❌ Erreur lors de la vérification SSO:', err);
                // En cas d'erreur, charger l'app directement
                loadRemoteApp();
            }
        }

        // Recevoir la configuration du preload
        window.addEventListener('DOMContentLoaded', () => {
            console.log('⏳ DOMContentLoaded - attendant configuration via IPC...');
            
            // S'abonner aux changements de config
            if (window.onConfigUpdate) {
                window.onConfigUpdate((config) => {
                    console.log('✅ Configuration mise à jour:', config);
                    if (config.serverUrl) {
                        serverUrl = config.serverUrl;
                        timeout = config.timeout || timeout;
                        configReceived = true;
                        // Vérifier SSO et charger l'app
                        checkAndInitSSO();
                    }
                });
            }
            
            // Vérifier si la config est déjà disponible (cas rare)
            if (window.celyavoxConfig && window.celyavoxConfig.serverUrl) {
                console.log('✅ Configuration déjà disponible:', window.celyavoxConfig.serverUrl);
                serverUrl = window.celyavoxConfig.serverUrl;
                timeout = window.celyavoxConfig.timeout || timeout;
                configReceived = true;
                // Vérifier SSO et charger l'app
                checkAndInitSSO();
            } else {
                console.log('⏳ celyavoxConfig.serverUrl est null, attendant IPC...');
                // Timeout de 3 secondes pour éviter une attente infinie
                setTimeout(() => {
                    if (!configReceived || !serverUrl) {
                        console.error('⚠️ Pas de configuration reçue après 3s, vérifier main.js');
                        showError();
                    }
                }, 3000);
            }
        });
    </script>
</body>
</html>
